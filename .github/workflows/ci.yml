name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_tracker
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/life_tracker
      NEXTAUTH_SECRET: ci-only-secret
      AUTH_DEV: "true"
    steps:
      - name: Checkout v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Create test role
        run: psql "$DATABASE_URL" -c "CREATE ROLE life_tracker_app LOGIN PASSWORD 'ci';"
      - name: Migrate database
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build production container
        run: docker build --tag life-tracker:ci .
      # Syft runs from its Docker Hub image, pinned by digest: the sbom-action downloads it from
      # GitHub Releases on every run, which failed the whole job during a Releases outage.
      - name: Generate production image SBOM
        run: |
          docker save life-tracker:ci -o "$RUNNER_TEMP/image.tar"
          docker run --rm -v "$RUNNER_TEMP:/work:ro" \
            anchore/syft:v1.27.1@sha256:844ed6a928ef9396fac26d1de374e71dcaf80df14f05841670ed41619c5a718f \
            docker-archive:/work/image.tar -o spdx-json -q > sbom.spdx.json
      - name: Upload production image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: life-tracker-sbom
          path: sbom.spdx.json
          if-no-files-found: error
      - name: Scan production container
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: life-tracker:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Validate Bicep
        # Bicep comes with the runner image; `az bicep install` downloads it from GitHub Releases.
        run: bicep build infra/main.bicep --stdout >/dev/null
      - name: Validate Azure scripts
        run: bash -n scripts/azure-preflight.sh scripts/azure-deploy.sh scripts/azure-teardown.sh
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=optional
      - name: Secret scan v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
