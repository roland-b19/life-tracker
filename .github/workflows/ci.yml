name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_tracker
      DATABASE_URL_MIGRATE: postgresql://postgres:postgres@127.0.0.1:5432/life_tracker
      NEXTAUTH_SECRET: ci-only-secret
      AUTH_DEV: "true"
    steps:
      - name: Checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Create test role
        run: psql "$DATABASE_URL" -c "CREATE ROLE life_tracker_app LOGIN PASSWORD 'ci';"
      - name: Migrate database
        run: npm run db:migrate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build production container
        run: docker build --tag life-tracker:ci .
      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout >/dev/null
      - name: Validate Azure scripts
        run: bash -n scripts/azure-preflight.sh scripts/azure-deploy.sh scripts/azure-teardown.sh
      - name: Dependency audit
        run: npm audit --audit-level=high --omit=optional
      - name: Secret scan v2
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
